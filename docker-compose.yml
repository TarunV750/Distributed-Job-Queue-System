# Phase 1: API + PostgreSQL. Redis, LocalStack and workers are added in later phases.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-jobqueue}
      POSTGRES_USER: ${DB_USERNAME:-jobqueue}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?copy .env.example to .env and set DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jobqueue} -d ${DB_NAME:-jobqueue}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-jobqueue}
      DB_USERNAME: ${DB_USERNAME:-jobqueue}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  pgdata:
